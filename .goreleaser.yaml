# GoReleaser config — https://goreleaser.com
# Check locally:   goreleaser check && goreleaser release --snapshot --clean
# Release:         push a tag like v0.1.0; .github/workflows/release.yml runs this.
version: 2
project_name: gitfolio

builds:
  - main: ./cmd/gitfolio
    binary: gitfolio
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  # No version in the file name, so install.sh can use GitHub's releases/latest/download/<file> URL.
  - name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows # install.ps1 unpacks it with Expand-Archive
        formats: [zip]
    files: [LICENSE, NOTICE, README.md]

checksum:
  name_template: checksums.txt
  algorithm: sha256

# Homebrew cask (formulas for prebuilt binaries, `brews`, are deprecated since v2.10); casks work on
# macOS and Linux. Install with: brew install Alineteam-Inc/tap/gitfolio
homebrew_casks:
  - name: gitfolio
    directory: Casks
    repository:
      owner: Alineteam-Inc
      name: homebrew-tap
      # Pushed with a deploy key that can write to homebrew-tap only (the org does not allow
      # fine-grained tokens). The secret holds the private key contents.
      git:
        url: git@github.com:Alineteam-Inc/homebrew-tap.git
        private_key: "{{ .Env.HOMEBREW_TAP_DEPLOY_KEY }}"
    homepage: https://aline.team
    description: Turn your git history into a verified developer portfolio
    license: Apache-2.0
    caveats: |
      Run `gitfolio init` to choose the repositories to collect.
    # The binary is not signed or notarized yet, so macOS would block the quarantined download.
    # GoReleaser's documented workaround clears the quarantine bit after install; it bypasses
    # Gatekeeper for this binary only. Replace with signing and notarization (planned).
    # Homebrew 7 deprecates `postflight` blocks for declarative `postflight_steps`, which GoReleaser's
    # hooks cannot write yet, so the block goes in as is ({{staged_path}} is Homebrew's, not a template).
    # Go 1.27 builds need macOS 13 (Ventura). Inside on_macos, or Homebrew on Linux refuses the cask.
    custom_block: |
      on_macos do
        depends_on macos: :ventura
      end
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{staged_path}}" }}/gitfolio"]
        end
      end

changelog:
  use: github
  filters:
    exclude: ["^docs:", "^test:"]
