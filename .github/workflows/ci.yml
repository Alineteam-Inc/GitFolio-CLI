name: ci

# GitFolio runs on macOS, Linux and Windows, so every change is tested on all three.
on:
  push:
    branches: [main, stage]
    paths-ignore: ["**.md", LICENSE, NOTICE] # words only, which no test reads (a release still tests)
  pull_request:
    paths-ignore: ["**.md", LICENSE, NOTICE]
  workflow_dispatch: # always tests, even a commit that passed already
  workflow_call: # release.yml runs this first

permissions:
  contents: read
  actions: read # seen: the runs this commit already had

concurrency: # a newer push to the same branch replaces a run still going
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A commit tested on all three already (on stage before main is moved to it, or before its release tag)
  # is not tested again.
  seen:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      passed: ${{ steps.check.outputs.passed }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: | # if GitHub cannot be asked, it is tested again
          n=0
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ]; then
            n=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&status=success&per_page=1" -q .total_count) || n=0
          fi
          echo "passed=$([ "${n:-0}" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "runs of ci that passed on $GITHUB_SHA: ${n:-0}"

  test:
    needs: seen
    if: needs.seen.outputs.passed != 'true'
    timeout-minutes: 20 # a stuck test does not hold a runner for six hours
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        shell: bash # also on Windows (Git Bash), so the per-test lines look the same everywhere
        run: | # one line per test; a failure prints everything else too
          s=0; go test -v ./... > test.log 2>&1 || s=$?
          grep -E '^ *(--- (PASS|FAIL|SKIP)|ok|FAIL|panic)' test.log
          if [ $s != 0 ]; then grep -v -E '^ *(=== RUN|--- PASS)' test.log; exit $s; fi

      # The install scripts, fed a local release-like folder: they must install the right archive
      # after checking its SHA-256, and refuse a tampered one.
      - name: install.sh
        if: runner.os != 'Windows'
        shell: bash
        run: |
          os=$(go env GOOS) arch=$(go env GOARCH) d=$RUNNER_TEMP/rel; mkdir -p $d
          go build -o gitfolio ./cmd/gitfolio && tar -czf $d/gitfolio_${os}_${arch}.tar.gz gitfolio
          (cd $d && shasum -a 256 *.tar.gz > checksums.txt)
          GITFOLIO_BASE_URL=file://$d GITFOLIO_INSTALL_DIR=$RUNNER_TEMP/bin sh install.sh
          GITFOLIO_BASE_URL=file://$d GITFOLIO_INSTALL_DIR=$RUNNER_TEMP/bin sh install.sh # again: replaces the binary
          $RUNNER_TEMP/bin/gitfolio version | tail -2
          echo tampered >> $d/gitfolio_${os}_${arch}.tar.gz
          if GITFOLIO_BASE_URL=file://$d GITFOLIO_INSTALL_DIR=$RUNNER_TEMP/bin2 sh install.sh; then echo "tampered archive was installed"; exit 1; fi

      - name: install.ps1 (Windows PowerShell 5.1 and PowerShell 7)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $d = Join-Path $env:RUNNER_TEMP 'rel'; New-Item -ItemType Directory $d | Out-Null
          go build -o gitfolio.exe ./cmd/gitfolio
          Compress-Archive gitfolio.exe (Join-Path $d 'gitfolio_windows_amd64.zip')
          $h = (Get-FileHash (Join-Path $d 'gitfolio_windows_amd64.zip') -Algorithm SHA256).Hash.ToLower()
          "$h  gitfolio_windows_amd64.zip" | Set-Content (Join-Path $d 'checksums.txt')
          $env:GITFOLIO_BASE_URL = ([Uri]$d).AbsoluteUri
          foreach ($ps in 'powershell', 'pwsh') {
            $env:GITFOLIO_INSTALL_DIR = Join-Path $env:RUNNER_TEMP "bin-$ps"
            & $ps -NoProfile -ExecutionPolicy Bypass -File install.ps1
            if ($LASTEXITCODE) { throw "install.ps1 failed under $ps" }
            & $ps -NoProfile -ExecutionPolicy Bypass -File install.ps1 # again: replaces gitfolio.exe
            if ($LASTEXITCODE) { throw "install.ps1 failed to replace gitfolio.exe under $ps" }
            & (Join-Path $env:GITFOLIO_INSTALL_DIR 'gitfolio.exe') version | Select-Object -Last 2
          }
          Add-Content (Join-Path $d 'gitfolio_windows_amd64.zip') 'tampered'
          $env:GITFOLIO_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'bin-tampered'
          & pwsh -NoProfile -File install.ps1
          if (-not $LASTEXITCODE) { throw 'tampered archive was installed' }
          if (Test-Path (Join-Path $env:GITFOLIO_INSTALL_DIR 'gitfolio.exe')) { throw 'tampered archive was installed' }
          exit 0 # the refused install above left a non-zero exit code on purpose
